---
layout: default
---

<article class="post">
  <div class="container">
    <a href="/blog/" class="post-back">&larr; Back to Blog</a>
    <header class="post-header">
      <h1>{{ page.title }}</h1>
      <time class="post-date">{{ page.date | date: "%B %d, %Y" }}</time>
    </header>
    <div class="post-content">
      {{ content }}
    </div>
    <a href="/blog/" class="post-back">&larr; Back to Blog</a>
  </div>
</article>
