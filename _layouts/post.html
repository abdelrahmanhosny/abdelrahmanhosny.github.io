---
layout: default
---

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ page.title | jsonify }},
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
  "url": "{{ page.url | absolute_url }}",
  "author": {
    "@type": "Person",
    "name": "Abdelrahman Hosny",
    "url": "https://abdelrahmanhosny.me"
  },
  "publisher": {
    "@type": "Person",
    "name": "Abdelrahman Hosny"
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ page.url | absolute_url }}"
  }
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://abdelrahmanhosny.me/" },
    { "@type": "ListItem", "position": 2, "name": "Blog", "item": "https://abdelrahmanhosny.me/blog/" },
    { "@type": "ListItem", "position": 3, "name": {{ page.title | jsonify }}, "item": "{{ page.url | absolute_url }}" }
  ]
}
</script>

<article class="post">
  <div class="container">
    <a href="/blog/" class="post-back">&larr; Back to Blog</a>
    <header class="post-header">
      <h1>{{ page.title }}</h1>
      <time class="post-date">{{ page.date | date: "%B %d, %Y" }}</time>
      <span class="post-author">By <a href="/" rel="author">Abdelrahman Hosny</a></span>
    </header>
    <div class="post-content">
      {{ content }}
    </div>
    <a href="/blog/" class="post-back">&larr; Back to Blog</a>
  </div>
</article>
